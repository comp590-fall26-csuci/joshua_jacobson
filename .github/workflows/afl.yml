name: AFL++

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  fuzz:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: pull afl++
      run: sudo apt install -y afl++
    - name: build afl++
      run: afl-cc -o dvcp lab5/dvcp.c
    - name: setup seeds
      run: |
        mkdir seeds
        cd seeds
        for i in {0..4}; do dd if=/dev/urandom of=seed=$i bs=64 count=10; done
    - name: run afl++
      run: |
        export AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES=1
        timeout --preserve-status 10 afl-fuzz -i seeds -o out -m none -d -- ./dvcp

