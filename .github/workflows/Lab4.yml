name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      working-directory: ./lab4
      run: make main
    - name: test
      working-directory: ./scripts
      run: bash ./fibTest.sh
    - name: Install Semgrep
      run: pip install semgrep
    - name: Run Semgrep Scan
      run: semgrep scan --config p/default --error
