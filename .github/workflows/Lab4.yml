name: C/C++ CI

on:
  push:
    branches: [ "Lab4" ]
  pull_request:
    branches: [ "Lab4" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make main
      working-directory: ./lab4
    - name: test
      run: bash ./scripts/figTest.sh
      working-directory: ./
