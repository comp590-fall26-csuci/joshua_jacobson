name: C/C++ CI

on:
  push:
    branches: [ "Lab4" ]
  pull_request:
    branches: [ "Lab4" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make
      working-directory: ./lab4
      run: make main
    - name: test
      working-directory: ./scripts
      run: bash ./figTest.sh
